# Example Configuration for Wavelet-Enhanced SPI Forecasting System
# =================================================================
# Copy this file and modify for your experiments
# Usage: python wavelet_spi_forecasting_v2.py --config myconfig.yaml

# ==================== PATHS ====================
input_file: "outputs/Stations_Thrace_Turker.xlsx"
output_dir: "results/experiment_example/"
id_column: "Istasyon_No"

# ==================== SPI SETTINGS ====================
spi_scales: [3, 6, 12]  # Time scales in months
spi_calibration_mode: "all"  # Options: 'all' | 'train_ratio' | 'fixed_range'
spi_calib_train_ratio: 0.70  # Used if mode='train_ratio'
spi_clim_start: null  # "1981-01-01" if mode='fixed_range'
spi_clim_end: null    # "2010-12-31" if mode='fixed_range'

# ==================== FORECASTING ====================
forecast_leads: [0, 1, 3, 6]  # Lead times in months (0=concurrent)

# ==================== MODEL SELECTION ====================
select_by: "KGE"  # Options: 'KGE' | 'RMSE'
top_k: 4          # Number of top models to analyze

# ==================== STATION PROCESSING ====================
run_all_stations: true   # Set false to run single station
station_id: null         # Station ID if run_all_stations=false

# ==================== PERFORMANCE ====================
fast_mode: false         # true = reduced wavelets & iterations
random_state: 42
cv_splits: 5
n_iter: 14               # Hyperparameter search iterations (6 in fast mode)
cv_gap: 36               # CV gap in months (avoid data leakage)
min_train_samples: 120   # Minimum training samples (months)
n_jobs: -1               # -1 = use all cores

# ==================== FEATURE ENGINEERING ====================
enable_wf: true          # Wavelet features (DWT statistics)
enable_wd: true          # Wavelet denoising
enable_wpd: true         # Wavelet packet decomposition

max_lag: 12

# Custom lag structures (optional)
lag_structures:
  M03: [1, 2, 12]
  M06: [1, 2, 3, 6, 12]
  M08: [1, 2, 3, 4, 5, 6, 11, 12]

date_align_strategy: "intersection"  # Options: 'intersection' | 'min_start'

# ==================== FEATURE SELECTION ====================
enable_feature_selection: false
feature_selection_mode: "variance"  # Options: 'variance' | 'from_model'
variance_threshold: 0.0

# ==================== MODELS ====================
enabled_models:
  HGBR: true
  SVR: true
  RF: true
  ET: true
  GBR: true
  RIDGE: true
  KNN: true
  LSVR: true

# ==================== WAVELETS ====================
# Full lists (used if fast_mode=false)
wavelets_db: ["db2", "db3", "db4", "db5", "db6", "db8", "db10"]
wavelets_sym: ["sym4", "sym5"]
wavelets_coi: ["coif3", "coif4"]

# Fast mode will override to: db=["db3","db4"], sym=["sym4"], coi=[]

# ==================== DIAGNOSTICS & VISUALIZATION ====================
make_plots: true
enable_month_skill_heatmap: true
enable_perm_importance: true
enable_pdp_ice: false             # Requires newer sklearn
enable_quality_report: true

# ==================== ADVANCED ====================
enable_caching: true
cache_dir: null  # null = auto (output_dir/.cache)
verbose: 1       # 0=WARNING, 1=INFO, 2=DEBUG
